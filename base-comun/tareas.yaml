# Manifiesto de tareas — jerarquía, dependencias, iteración y fusión.
# Única fuente de verdad para la cascada. La app lo lee para resolver el orden
# topológico y saber qué regenerar. Editá este archivo (no el código) para
# añadir/ajustar tareas.

tareas:
  a1:
    archivo: tarea-plan_anual.md
    descripcion: Planificación anual
    depende_de: []
    dependientes: [a2]

  a2:
    archivo: tarea-plan_de_clases.md
    descripcion: Planificación de clases (libro de temas)
    depende_de: [a1]
    dependientes: [a3]
    # a2 es PRERREQUISITO de b1: contiene la tabla de clases.

  a3:
    archivo: tarea-detalle_encuentros.md
    descripcion: Detalle completo de cada encuentro (sin restricciones de longitud)
    depende_de: [a2]
    dependientes: [b1]
    # a3 es PRERREQUISITO opcional de b1: si existe, alimenta b1 con detalle y fundamentos previos.

  b1:
    archivo: tarea-material_didactico.md
    descripcion: Material didáctico
    depende_de: [a2]
    dependientes: [b6, b2, b5]
    itera: por_clase        # default: un material por clase (temas combinados)

  b2:
    archivo: tarea-actividad_aulica.md
    descripcion: Actividad áulica
    depende_de: [b1]
    dependientes: [b4]

  b4:
    archivo: tarea-respuestas_actividad_aulica.md
    descripcion: Respuestas de la actividad áulica
    depende_de: [b2]

  b5:
    archivo: tarea-planificacion_aulica.md
    descripcion: Planificación áulica (plan institucional de la clase)
    depende_de: [b1]

  b6:
    archivo: tarea-guia_docente.md
    descripcion: Guía docente (síntesis + ejemplos sintéticos + aclaraciones + conexiones)
    depende_de: [b1]

# Vocabulario controlado de la columna "Carácter/Objetivo" de a2.
# La app valida que el valor esté en esta lista (warn/rechazo según config).
vocabulario_caracter:
  - Presentación
  - Diagnóstico
  - Teórica
  - Práctica
  - Teórico-Práctica
  - Dialogada
  - Reflexiva
  - Aplicación
  - Argumentativa
  - Evaluativa
  - Evaluativa (en proceso o final)
  - Experimental
  - Fijación
  - Informativa
  - Integración
  - Interpretativa
  - Investigación
  - Lectura
  - Lúdica
  - Orientadora
  - Repaso
  - Revisión
  - Taller
  - Intensificación
  - Cierre
  - Observación
  - Otras
